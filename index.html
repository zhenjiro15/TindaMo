<script>
/* V23: kung may plugin (hal. FCM / push) na tumatawag ng Capacitor.registerPlugin pero wala ito, huwag mag-crash */
(function(){var C=window.Capacitor;if(!C||typeof C.registerPlugin==='function')return;
C.registerPlugin=function(n){var P=(C.Plugins||(C.Plugins={}));if(P[n])return P[n];
var m=function(){return Promise.reject(new Error(n+' plugin is not available'))};
return P[n]=new Proxy({},{get:function(_,k){return k==='then'?undefined:(k==='addListener'?function(){return Promise.resolve({remove:function(){}})}:m)}})}})();
</script>
